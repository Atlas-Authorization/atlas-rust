[package]
name = "atlasauth"
version = "0.6.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
description = "Official Atlas backend verification crate: local RS256 session-token verification against a cached JWKS, plus API-key verification. The Rust peer of @atlasauth/backend, atlas-go, and the Ruby SDK."
repository = "https://github.com/Atlas-Authorization/atlas-rust"
documentation = "https://docs.rs/atlasauth"
readme = "README.md"
keywords = ["atlas", "auth", "jwt", "jwks", "verification"]
categories = ["authentication", "web-programming"]

[features]
# The convenience constructors (`AtlasBackend::new`, `ApiKeyVerifier::new`,
# `BackendClient::new`, and the client-feature flows) that wire a reqwest-backed
# HTTP transport. Disable it to compile with no HTTP dependency and supply your
# own `JwksSource` / `HttpPost` / `HttpTransport` instead.
default = ["reqwest-transport"]
reqwest-transport = ["dep:reqwest"]

# P0-2: the typed management client for the secret-key Backend API, the typed
# webhook verifier, and the cursor-pagination helper. Mirrors
# `@atlasauth/backend`'s resource surface and webhook signature scheme.
backend = ["dep:hmac", "dep:sha2", "dep:base64", "dep:tokio"]

# P0-1: the native (first-party) client SDK — PKCE S256 + device-authorization
# OAuth flows, the RFC 8693 OAuth→session exchange, a lazy single-flight session
# manager, a `SecureStore` abstraction, and the `/v1/client/me/**` self-service
# surface over a session bearer.
client = ["dep:sha2", "dep:base64", "dep:rand", "dep:url", "dep:tokio"]

# Framework-native Axum integration: the `AtlasClaims` extractor, the
# `AtlasLayer` tower middleware, and the `require_auth` helper. Off by default
# and additive — it only wraps the existing verifier, pulling in `axum`/`tower`
# and nothing on the default build. The `http`/`tower-service`/`tower-layer`
# types it needs arrive transitively through `axum` (re-exported as
# `axum::http`) and `tower`.
axum = ["dep:axum", "dep:tower"]

# Platform `SecureStore` backends, off by default. Each gates the keyring-backed
# store on its matching target so the crate still builds on any one platform (and
# `--all-features` on a single host only compiles the host's backend). They are
# only useful alongside `client`.
#
# `keychain` now serves BOTH macOS and iOS — the `keyring` Apple backend
# (`apple-native`) is declared for both targets and its API is identical, so an
# iOS app gets the same Keychain-backed store with no extra feature.
keychain = ["dep:keyring"]  # macOS + iOS Keychain (Apple Secure Enclave-backed)
dpapi = ["dep:keyring"]     # Windows Credential Manager (DPAPI)

# Linux has TWO mutually-independent backends so a host can pick a dbus-free one.
# `libsecret` is the desktop Secret Service (needs libdbus/zbus at build+run);
# `linux-keyutils` is the kernel keyutils session keyring (NO dbus), for a
# headless box, a container, or a CI runner where no Secret Service daemon runs.
# They select the matching `keyring` backend feature; the Linux `keyring` target
# dep itself carries no default backend, so enabling ONLY `linux-keyutils` pulls
# no dbus crate at all.
libsecret = ["dep:keyring", "keyring/sync-secret-service"] # Linux Secret Service (libdbus)
linux-keyutils = ["dep:keyring", "keyring/linux-native"]   # Linux kernel keyutils, no dbus

# A dependency-light, cross-platform ENCRYPTED-FILE store: XChaCha20-Poly1305 over
# a key derived (HKDF-SHA256) from a caller-supplied passphrase or machine key. It
# needs no OS keychain and no dbus, so it is the portable fallback on a headless
# Linux box — and, being pure Rust, it compiles and round-trips on every target
# (which is how its round-trip is tested on the CI host). Only useful with `client`.
encrypted-file = ["client", "dep:chacha20poly1305", "dep:hkdf", "dep:sha2", "dep:base64", "dep:rand"]

# §P1-7 the public MACHINE (device) flow: generate an Ed25519 keypair, enrol it,
# sign the server challenge, and mint/refresh a short m2m token. All three device
# endpoints are public (no secret key), so this is a CLIENT-side feature; it adds
# `ed25519-dalek` for the keypair + signing. Only useful with `client`.
machine = ["client", "dep:ed25519-dalek", "dep:rand"]

[dependencies]
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
# `backend` (webhook HMAC) + `client` (PKCE S256). SHA-256 via a pure-Rust crate
# so the crate honours `#![forbid(unsafe_code)]`.
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.8", optional = true }
url = { version = "2", optional = true }
# Async timing (backend retry backoff) + an async mutex (client single-flight
# refresh). Runtime-agnostic feature set; a consumer brings their own executor.
tokio = { version = "1", default-features = false, features = ["time", "sync"], optional = true }
# Framework-native Axum integration (`axum` feature). `tower` supplies the
# `Layer`/`Service` traits the `AtlasLayer` middleware implements; `axum` brings
# the extractor/response machinery (and re-exports the `http` types, so no direct
# `http` dependency is needed). Both are optional and absent from the default
# build.
axum = { version = "0.8", default-features = false, features = ["matched-path", "tokio"], optional = true }
tower = { version = "0.5", default-features = false, optional = true }

# Ed25519 keypair + detached signatures for the public machine flow (`machine`
# feature). `pem` gives SPKI/PKCS#8 PEM import+export (the wire format the enrol
# endpoint takes and a SecureStore persists); `rand_core` lets `SigningKey::generate`
# take an `OsRng`. Pure-Rust, so the crate keeps `#![forbid(unsafe_code)]`.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pem", "rand_core"], optional = true }

# The encrypted-file store (`encrypted-file` feature). XChaCha20-Poly1305 AEAD
# with an HKDF-SHA256-derived key. All pure-Rust.
chacha20poly1305 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }

# Platform secure-store backends. Declared per-target so a non-matching OS crate
# never enters the dependency graph — `--all-features` on macOS pulls only the
# Apple backend, so the build stays green on a single host. macOS and iOS share
# the Apple `security-framework` backend; the Linux dep carries no default backend
# so the `libsecret` / `linux-keyutils` features each select exactly one (and
# `linux-keyutils` pulls no dbus).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"], optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
# Used by the backend tests to produce a known-good webhook signature.
hmac = "0.12"
sha2 = "0.10"
# `tests/client.rs` verifies the machine flow end-to-end: the fake /token endpoint
# checks the SDK's Ed25519 signature over the challenge against the enrolled key.
ed25519-dalek = { version = "2", features = ["pem", "rand_core"] }
# `tests/axum.rs` drives the router with `tower::ServiceExt::oneshot` (no
# network). The `util` feature carries `ServiceExt`; it merges with the optional
# `tower` dep the `axum` feature activates, so it is present only when the axum
# tests are compiled.
tower = { version = "0.5", features = ["util"] }
