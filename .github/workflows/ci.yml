name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
  msrv:
    # The declared rust-version, over the default and framework features (not the sqlx feature, which needs
    # sqlx's own newer MSRV).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo check --features "backend client machine rp rp-axum rp-actix web-bot-auth tracing actix rocket axum sealed-box encrypted-file"
  tauri-plugin:
    # tauri-plugin-atlas is its own crate (integrations/tauri-plugin-atlas) over this one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/tauri-plugin-atlas
      - run: cargo test
        working-directory: integrations/tauri-plugin-atlas
  generated:
    # The generated catalog must match scripts/openapi.snapshot.json + catalog_pins.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Regenerate and fail on any diff
        run: |
          set -euo pipefail
          gen="src/backend/catalog.rs src/backend/types.rs tests/catalog.rs tests/catalog_types.rs"
          # Compare formatted-to-formatted, so the check does not depend on the rustfmt version that wrote the commit.
          rustfmt --edition 2021 $gen
          mkdir -p /tmp/before && cp --parents $gen /tmp/before
          python3 -I scripts/gen_catalog.py
          for f in $gen; do diff -u "/tmp/before/$f" "$f" || { echo "::error::$f is out of date: run python3 scripts/gen_catalog.py"; exit 1; }; done
