[package]
name = "tauri-plugin-atlas"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
description = "Tauri 2 plugin for Atlas: hosted sign-in in the system browser (PKCE, loopback redirect), the session kept in the OS keychain, and a fresh token for your API calls."
repository = "https://github.com/Atlas-Authorization/atlas-rust"
links = "tauri-plugin-atlas"
publish = false

# Its own workspace: this plugin lives inside the atlasauth crate's directory.
[workspace]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"
rand = "0.8"
base64 = "0.22"
open = "5"
tokio = { version = "1", features = ["rt"] }
atlasauth = { path = "../..", default-features = false, features = ["client", "reqwest-transport"] }

# The OS secret store holding the rotating refresh token.
[target.'cfg(target_os = "macos")'.dependencies]
atlasauth = { path = "../..", default-features = false, features = ["client", "reqwest-transport", "keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
atlasauth = { path = "../..", default-features = false, features = ["client", "reqwest-transport", "dpapi"] }

[target.'cfg(target_os = "linux")'.dependencies]
atlasauth = { path = "../..", default-features = false, features = ["client", "reqwest-transport", "libsecret"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
